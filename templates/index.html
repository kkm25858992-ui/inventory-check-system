<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ourbox 오산센터 재고조사</title>


<style>

* {
    box-sizing: border-box;
}


body {

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    margin: 0;

    padding: 15px;

    background: #f0f9f4;

}


.header {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #2e7d32;

    margin-bottom: 15px;

}


.card {

    background: white;

    padding: 18px;

    border-radius: 12px;

    margin-top: 10px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

}


input {

    width: 100%;

    padding: 15px;

    font-size: 20px;

    margin-top: 8px;

    border: 1px solid #ccc;

    border-radius: 8px;

}


input:focus {

    outline: 3px solid #a5d6a7;

    border-color: #4caf50;

}


button {

    width: 100%;

    padding: 15px;

    font-size: 18px;

    margin-top: 8px;

    background: #66bb6a;

    color: white;

    border: none;

    border-radius: 8px;

    font-weight: bold;

}


button:active {

    transform: scale(0.98);

}


.green-button {

    background: #66bb6a;

}


.red-button {

    background: #ef5350;

}


.gray-button {

    background: #78909c;

}


.scan-label {

    display: block;

    margin-top: 15px;

    font-size: 15px;

    font-weight: bold;

    color: #555;

}


.info-box {

    background: #f5f5f5;

    padding: 12px;

    border-radius: 8px;

    margin-top: 10px;

}


.info-row {

    padding: 5px 0;

}


.big-number {

    font-size: 28px;

    font-weight: bold;

    text-align: center;

    margin-top: 15px;

    padding: 15px;

    background: #e8f5e9;

    border-radius: 10px;

}


.progress {

    width: 100%;

    height: 10px;

    background: #ddd;

    border-radius: 5px;

    overflow: hidden;

}


.progress-bar {

    height: 10px;

    background: #4caf50;

}


.button-row {

    display: flex;

    gap: 8px;

}


.button-row button {

    flex: 1;

}


.hidden {

    display: none !important;

}


.upload-box {

    background: white;

    padding: 15px;

    border-radius: 12px;

    margin-top: 10px;

}


.file-input {

    font-size: 16px;

}


.status {

    margin-top: 10px;

    padding: 12px;

    border-radius: 8px;

    background: #e8f5e9;

    font-weight: bold;

}


.result-card {

    background: #e8f5e9;

    padding: 15px;

    border-radius: 10px;

    margin-top: 10px;

}


.qty-title {

    font-size: 16px;

    font-weight: bold;

    margin-top: 15px;

}


</style>

</head>


<body>


<div class="header">

    ourbox 오산센터 재고조사

</div>


<!-- =====================================================
     엑셀 업로드
====================================================== -->

<div
    id="uploadBox"
    class="upload-box"
>

    <form
        id="uploadForm"
        action="/upload"
        method="post"
        enctype="multipart/form-data"
    >

        <label>

            <b>
                재고조사 엑셀 업로드
            </b>

        </label>


        <input
            class="file-input"
            type="file"
            name="file"
            accept=".xlsx,.xls,.csv"
            required
        >


        <button
            type="submit"
            class="green-button"
        >

            엑셀 업로드

        </button>

    </form>


    <div
        id="uploadStatus"
        class="status hidden"
    ></div>

</div>


<!-- =====================================================
     메인
====================================================== -->

<div
    id="app"
></div>


<!-- =====================================================
     조사 완료 버튼
====================================================== -->

<div
    id="completeBox"
    class="card hidden"
>

    <button
        id="downloadBtn"
        class="green-button"
        onclick="download()"
    >
        엑셀 다운로드
    </button>


    <button
        id="shareBtn"
        class="green-button"
        onclick="share()"
    >
        엑셀 공유
    </button>


    <button
        class="green-button"
        onclick="createQR()"
    >
        QR코드 생성
    </button>

</div>


<!-- =====================================================
     외부 JS
====================================================== -->

<script src="{{ url_for('static', filename='script.js') }}"></script>


<script>

window.INITIAL_DATA =
    {{ data | tojson }};


window.INITIAL_LOOKUP =
    {{ lookup | tojson }};


</script>


</body>

</html>
