<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>ourbox 오산센터 재고조사</title>


<style>

* {
    box-sizing: border-box;
}


body {

    font-family: sans-serif;

    padding: 15px;

    margin: 0;

    background: #f0f9f4;
}


.header {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #2e7d32;

    margin-bottom: 15px;
}


.card {

    background: white;

    padding: 18px;

    border-radius: 12px;

    margin-top: 10px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.08);
}


input {

    width: 100%;

    padding: 16px;

    font-size: 20px;

    margin-top: 8px;

    border: 1px solid #ccc;

    border-radius: 8px;
}


button {

    width: 100%;

    padding: 16px;

    font-size: 18px;

    margin-top: 8px;

    background: #66bb6a;

    color: white;

    border: none;

    border-radius: 8px;
}


button:active {

    opacity: 0.7;
}


.product-check-btn,
.download-btn,
.share-btn {

    background: #66bb6a;

    color: white;
}


.rack-btn {

    background: #66bb6a;
}


.barcode-btn {

    background: #66bb6a;
}


.save-qty-btn {

    background: #66bb6a;
}


.qr-btn {

    background: #66bb6a;
}


.upload-btn {

    background: #66bb6a;
}


#uploadBox {

    background: white;

    padding: 15px;

    border-radius: 12px;
}


.info-row {

    font-size: 18px;

    margin-top: 10px;
}


.info-label {

    font-weight: bold;
}


.qty-title {

    font-size: 20px;

    font-weight: bold;

    margin-top: 20px;
}


.qty-result {

    background: #f1f8e9;

    padding: 15px;

    border-radius: 8px;

    margin-top: 10px;

    font-size: 22px;

    font-weight: bold;

    text-align: center;
}


.status {

    padding: 12px;

    border-radius: 8px;

    background: #e8f5e9;

    margin-top: 10px;

    font-size: 17px;
}


.scan-box {

    margin-top: 15px;
}


.scan-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 5px;
}


.nav-buttons {

    display: flex;

    gap: 6px;

    margin-top: 10px;
}


.nav-buttons button {

    flex: 1;
}


.hidden {

    display: none !important;
}


/* =================================================
   날짜 입력
================================================= */

.date-title {

    font-size: 20px;

    font-weight: bold;

    margin-top: 20px;
}


.date-inputs {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 8px;
}


.date-inputs input {

    margin-top: 0;

    text-align: center;

    padding: 14px 5px;
}


.date-year {

    flex: 2;
}


.date-month,
.date-day {

    flex: 1;
}


.date-separator {

    font-size: 24px;

    font-weight: bold;
}


</style>

</head>


<body>


<div class="header">
    ourbox 오산센터 재고조사
</div>


<!-- =================================================
     업로드
================================================= -->

<div id="uploadBox">

    <form
        id="uploadForm"
        action="/upload"
        method="post"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="file"
            accept=".xlsx,.xls,.csv"
            required
        >


        <button
            type="submit"
            class="upload-btn"
        >
            상품마스터 엑셀 업로드
        </button>

    </form>


    <p
        style="
            font-size:14px;
            color:#666;
        "
    >

        ※ 업로드 엑셀의 시트2<br>

        A열 = 화주사<br>

        B열 = 바코드<br>

        C열 = 입수량<br>

        D열 = 상품명

    </p>

</div>


<div id="app"></div>


<script>

let mapping = {{ mapping|tojson }};

</script>


<script src="/static/script.js"></script>


</body>

</html>
