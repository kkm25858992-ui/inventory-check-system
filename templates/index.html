<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>ourbox 오산센터 재고조사</title>


<style>

/* =========================================================
   기본
========================================================= */

* {

    box-sizing: border-box;
}


body {

    font-family: sans-serif;

    padding: 15px;

    margin: 0;

    background: #f0f9f4;
}


/* =========================================================
   헤더
========================================================= */

.header {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #2e7d32;

    margin-bottom: 15px;
}


/* =========================================================
   카드
========================================================= */

.card {

    background: white;

    padding: 18px;

    border-radius: 12px;

    margin-top: 10px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.08);
}


/* =========================================================
   입력
========================================================= */

input {

    width: 100%;

    padding: 16px;

    font-size: 20px;

    margin-top: 8px;

    border: 1px solid #ccc;

    border-radius: 8px;
}


/* =========================================================
   버튼
========================================================= */

button {

    width: 100%;

    padding: 16px;

    font-size: 18px;

    margin-top: 8px;

    background: #66bb6a;

    color: white;

    border: none;

    border-radius: 8px;
}


button:active {

    opacity: 0.7;
}


/* =========================================================
   기존 버튼
========================================================= */

.product-check-btn,
.download-btn,
.share-btn {

    background: #66bb6a;

    color: white;
}


.rack-btn {

    background: #66bb6a;
}


.barcode-btn {

    background: #66bb6a;
}


.save-qty-btn {

    background: #66bb6a;
}


.qr-btn {

    background: #66bb6a;
}


.upload-btn {

    background: #66bb6a;
}


/* =========================================================
   신규 재고 버튼
========================================================= */

.new-inventory-btn {

    background: #43a047;

    color: white;

    font-weight: bold;
}


.save-new-btn {

    background: #2e7d32;

    color: white;

    font-weight: bold;
}


/* =========================================================
   조사 완료건 / 수정
========================================================= */

.completed-btn {

    background: #2e7d32;

    color: white;

    font-weight: bold;
}


.completed-list {

    margin-top: 12px;
}


.completed-item {

    background: #f8fbf8;

    border: 1px solid #d5e8d5;

    border-radius: 10px;

    padding: 14px;

    margin-top: 10px;
}


.completed-item-title {

    font-size: 19px;

    font-weight: bold;

    color: #2e7d32;

    margin-bottom: 10px;
}


.completed-item-info {

    font-size: 16px;

    line-height: 1.7;

    color: #333;
}


.edit-btn {

    background: #43a047;

    color: white;

    font-weight: bold;
}


.delete-btn {

    background: #d32f2f;

    color: white;

    font-weight: bold;
}


.back-btn {

    background: #757575;

    color: white;
}


/* =========================================================
   업로드
========================================================= */

#uploadBox {

    background: white;

    padding: 15px;

    border-radius: 12px;
}


/* =========================================================
   정보
========================================================= */

.info-row {

    font-size: 18px;

    margin-top: 10px;
}


.info-label {

    font-weight: bold;
}


/* =========================================================
   제목
========================================================= */

.qty-title {

    font-size: 20px;

    font-weight: bold;

    margin-top: 20px;
}


.new-title {

    font-size: 24px;

    font-weight: bold;

    text-align: center;

    color: #2e7d32;

    margin-bottom: 10px;
}


/* =========================================================
   결과
========================================================= */

.qty-result {

    background: #f1f8e9;

    padding: 15px;

    border-radius: 8px;

    margin-top: 10px;

    font-size: 22px;

    font-weight: bold;

    text-align: center;
}


/* =========================================================
   상태
========================================================= */

.status {

    padding: 12px;

    border-radius: 8px;

    background: #e8f5e9;

    margin-top: 10px;

    font-size: 17px;
}


/* =========================================================
   스캔
========================================================= */

.scan-box {

    margin-top: 15px;
}


.scan-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 5px;
}


/* =========================================================
   네비게이션
========================================================= */

.nav-buttons {

    display: flex;

    gap: 6px;

    margin-top: 10px;
}


.nav-buttons button {

    flex: 1;
}


/* =========================================================
   숨김
========================================================= */

.hidden {

    display: none !important;
}


/* =========================================================
   날짜
========================================================= */

.date-title {

    font-size: 20px;

    font-weight: bold;

    margin-top: 20px;
}


.date-inputs {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 8px;
}


.date-inputs input {

    margin-top: 0;

    text-align: center;

    padding: 14px 5px;
}


.date-year {

    flex: 2;
}


.date-month,
.date-day {

    flex: 1;
}


.date-separator {

    font-size: 24px;

    font-weight: bold;
}


/* =========================================================
   상품명 연관검색
========================================================= */

.autocomplete-container {

    position: relative;

    width: 100%;
}


.product-suggestions {

    display: none;

    position: absolute;

    top: 100%;

    left: 0;

    right: 0;

    background: white;

    border: 1px solid #ccc;

    border-top: none;

    border-radius: 0 0 8px 8px;

    max-height: 280px;

    overflow-y: auto;

    z-index: 9999;

    box-shadow:
        0 4px 8px rgba(0,0,0,0.12);
}


.product-suggestion {

    padding: 14px;

    border-bottom: 1px solid #eee;

    cursor: pointer;

    background: white;
}


.product-suggestion:active {

    background: #e8f5e9;
}


.suggestion-name {

    font-size: 18px;

    font-weight: bold;

    color: #222;
}


.suggestion-info {

    font-size: 13px;

    color: #777;

    margin-top: 5px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.no-suggestion {

    padding: 15px;

    text-align: center;

    color: #777;

    font-size: 16px;
}

</style>

</head>


<body>


<!-- =========================================================
     헤더
========================================================= -->

<div class="header">

    ourbox 오산센터 재고조사

</div>


<!-- =========================================================
     업로드
========================================================= -->

<div id="uploadBox">

    <form
        id="uploadForm"
        action="/upload"
        method="post"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="file"
            accept=".xlsx,.xlsm,.csv"
            required
        >


        <button
            type="submit"
            class="upload-btn"
        >

            상품마스터 엑셀 업로드

        </button>

    </form>


    <p
        style="
            font-size:14px;
            color:#666;
        "
    >

        ※ 업로드 엑셀의 시트2<br>

        A열 = 화주사<br>

        B열 = 바코드<br>

        C열 = 입수량<br>

        D열 = 상품명

    </p>

</div>


<!-- =========================================================
     메인 앱
========================================================= -->

<div id="app"></div>


<!-- =========================================================
     서버에서 전달되는 데이터
========================================================= -->

<script>

let mapping =
    {{ mapping|tojson }};


/*
 * 새 엑셀 업로드 여부
 *
 * true이면 이전 재고조사 데이터를 삭제합니다.
 */

let newUpload =
    {{ new_upload|default(false)|tojson }};

</script>


<!-- =========================================================
     JavaScript
========================================================= -->

<script src="/static/script.js"></script>


</body>

</html>
