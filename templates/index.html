<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>ourbox 오산센터 재고조사</title>


<style>

* {
    box-sizing: border-box;
}


body {

    font-family: sans-serif;

    margin: 0;

    padding: 15px;

    background: #f0f9f4;

}


.header {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #2e7d32;

    margin-bottom: 15px;

}


.card {

    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-top: 10px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.08);

}


input {

    width: 100%;

    padding: 17px;

    font-size: 20px;

    margin-top: 8px;

    border: 1px solid #ccc;

    border-radius: 8px;

}


input:focus {

    outline: none;

    border: 2px solid #4caf50;

}


button {

    width: 100%;

    padding: 17px;

    font-size: 18px;

    margin-top: 8px;

    border: none;

    border-radius: 8px;

    background: #66bb6a;

    color: white;

}


button:active {

    transform: scale(0.98);

}


.scan-title {

    text-align: center;

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 10px;

}


.scan-message {

    text-align: center;

    color: #666;

    margin-bottom: 15px;

}


.current-rack {

    background: #e8f5e9;

    padding: 15px;

    border-radius: 8px;

    text-align: center;

    margin-bottom: 15px;

}


.current-rack-title {

    color: #666;

    font-size: 14px;

}


.current-rack-value {

    font-size: 28px;

    font-weight: bold;

    color: #2e7d32;

    margin-top: 5px;

}


.info-row {

    display: flex;

    justify-content: space-between;

    padding: 11px 0;

    border-bottom: 1px solid #eee;

    gap: 10px;

}


.info-label {

    font-weight: bold;

    color: #555;

}


.info-value {

    font-weight: bold;

    text-align: right;

    word-break: break-all;

}


.quantity-title {

    font-size: 20px;

    font-weight: bold;

    margin-top: 20px;

}


.quantity-result {

    background: #f5f5f5;

    padding: 15px;

    margin-top: 12px;

    border-radius: 8px;

    text-align: center;

}


.quantity-result-label {

    color: #666;

}


.quantity-result-value {

    font-size: 32px;

    font-weight: bold;

    color: #2e7d32;

    margin-top: 5px;

}


.progress-box {

    margin-top: 20px;

}


.progress-background {

    background: #ddd;

    height: 12px;

    border-radius: 6px;

    overflow: hidden;

}


.progress-bar {

    height: 12px;

    background: #4caf50;

}


.download-button {

    background: #1976d2;

}


.share-button {

    background: #7b1fa2;

}


.qr-button {

    background: #455a64;

}


.gray-button {

    background: #777;

}


.danger-button {

    background: #e53935;

}


#uploadForm {

    background: white;

    padding: 15px;

    border-radius: 12px;

}


#uploadForm input {

    font-size: 16px;

}


.result-item {

    background: white;

    padding: 12px;

    border-radius: 8px;

    margin-top: 8px;

    border-left: 5px solid #4caf50;

}


.result-item strong {

    font-size: 17px;

}


.small-text {

    color: #666;

    font-size: 14px;

    margin-top: 5px;

}


#qr-box {

    margin-top: 15px;

}

</style>

</head>


<body>


<div class="header">

    ourbox 오산센터 재고조사

</div>


<!-- =====================================================
     엑셀 업로드
====================================================== -->

<form
    id="uploadForm"
    action="/upload"
    method="post"
    enctype="multipart/form-data"
>

    <input
        type="file"
        name="file"
        accept=".xlsx,.xls"
        required
    >


    <button type="submit">

        재고조사 엑셀 업로드

    </button>

</form>


<!-- =====================================================
     메인
====================================================== -->

<div id="app"></div>


<script>

let data = {{ data|tojson }};

let masterData = {{ master_data|tojson }};

let currentRack = "";

let currentProduct = null;

let completedCount = 0;


/* =====================================================
   페이지 시작
===================================================== */

window.onload = function(){

    /*
        기존 작업 이어하기
    */

    const savedInventory =
        localStorage.getItem(
            "inventoryData"
        );


    const savedMaster =
        localStorage.getItem(
            "inventoryMasterData"
        );


    if(savedInventory){

        try{

            const saved =
                JSON.parse(
                    savedInventory
                );


            if(
                Array.isArray(saved) &&
                saved.length > 0
            ){

                const continueWork =
                    confirm(
                        "이전에 작업한 재고조사 데이터가 있습니다.\n\n" +
                        "이어서 작업하시겠습니까?"
                    );


                if(continueWork){

                    data = saved;


                    if(savedMaster){

                        masterData =
                            JSON.parse(
                                savedMaster
                            );

                    }

                }else{

                    localStorage.removeItem(
                        "inventoryData"
                    );

                    localStorage.removeItem(
                        "inventoryMasterData"
                    );

                }

            }

        }catch(error){

            console.error(
                error
            );

        }

    }


    if(
        masterData.length > 0
    ){

        document
            .getElementById(
                "uploadForm"
            )
            .style.display =
                "none";

        saveLocal();

        render();

    }

};

</script>


<script src="/static/script.js"></script>


</body>

</html>
