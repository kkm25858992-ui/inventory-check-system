<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ourbox 오산센터 재고조사</title>

<style>

* {
    box-sizing: border-box;
}

body {

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    padding: 15px;

    margin: 0;

    background: #f0f9f4;
}


/* =========================
   헤더
========================= */

.header {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #2e7d32;

    margin-bottom: 15px;
}


/* =========================
   카드
========================= */

.card {

    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-top: 10px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}


/* =========================
   입력창
========================= */

input {

    width: 100%;

    padding: 16px;

    font-size: 20px;

    margin-top: 8px;

    border: 1px solid #ccc;

    border-radius: 8px;

    outline: none;
}

input:focus {

    border-color: #4caf50;

    box-shadow:
        0 0 0 2px rgba(76,175,80,0.15);
}


/* =========================
   버튼
========================= */

button {

    width: 100%;

    padding: 16px;

    font-size: 18px;

    margin-top: 8px;

    background: #66bb6a;

    color: white;

    border: none;

    border-radius: 8px;

    font-weight: bold;
}

button:active {

    transform: scale(0.98);
}


/* =========================
   제품 확인 버튼
========================= */

.product-button {

    background: #66bb6a;
}


/* =========================
   다운로드 / 공유
========================= */

.download-button {

    background: #66bb6a;
}

.share-button {

    background: #66bb6a;
}


/* =========================
   현재 단계
========================= */

.step-title {

    font-size: 23px;

    font-weight: bold;

    margin-bottom: 10px;

    text-align: center;
}


/* =========================
   제품정보
========================= */

.info-box {

    background: #f5f5f5;

    border-radius: 8px;

    padding: 12px;

    margin-top: 10px;
}

.info-row {

    display: flex;

    justify-content: space-between;

    padding: 7px 0;

    border-bottom: 1px solid #ddd;
}

.info-row:last-child {

    border-bottom: none;
}

.info-label {

    font-weight: bold;
}

.info-value {

    text-align: right;
}


/* =========================
   수량 계산
========================= */

.total-box {

    background: #e8f5e9;

    border-radius: 8px;

    padding: 15px;

    margin-top: 12px;

    text-align: center;
}

.total-title {

    font-size: 17px;

    font-weight: bold;
}

.total-value {

    font-size: 32px;

    font-weight: bold;

    color: #2e7d32;

    margin-top: 5px;
}


/* =========================
   진행 상태
========================= */

.progress-text {

    text-align: center;

    font-weight: bold;

    margin-bottom: 8px;
}

.progress-bg {

    width: 100%;

    height: 10px;

    background: #ddd;

    border-radius: 5px;

    overflow: hidden;
}

.progress-bar {

    height: 10px;

    background: #4caf50;

    border-radius: 5px;

    transition: width 0.2s;
}


/* =========================
   신규 / 업로드
========================= */

#newItemBox {

    display: none;

    background: white;

    padding: 15px;

    border-radius: 12px;

    margin-top: 10px;
}


/* =========================
   자동완성
========================= */

.autocomplete-items {

    border: 1px solid #ddd;

    max-height: 150px;

    overflow-y: auto;

    background: white;
}

.autocomplete-items div {

    padding: 10px;

    cursor: pointer;
}


/* =========================
   완료
========================= */

.complete-box {

    text-align: center;

    padding: 20px;
}

.complete-box h2 {

    color: #2e7d32;
}

</style>

</head>


<body>


<div class="header">

    ourbox 오산센터 재고조사

</div>


<!-- =================================================
     엑셀 업로드
================================================= -->

<form
    id="uploadForm"
    action="/upload"
    method="post"
    enctype="multipart/form-data"
>

    <div class="card">

        <input
            type="file"
            name="file"
            accept=".xlsx,.xls,.csv"
            required
        >

        <button
            type="submit"
        >
            엑셀 업로드
        </button>

    </div>

</form>


<!-- =================================================
     메인
================================================= -->

<div id="app"></div>


<!-- =================================================
     신규 재고
================================================= -->

<button
    id="newItemBtn"
    onclick="toggleNewItem()"
    style="display:none;"
>
    신규 재고등록
</button>


<div id="newItemBox">

    <input
        id="new_rack"
        placeholder="랙 바코드"
    >

    <input
        id="new_barcode"
        placeholder="제품 바코드"
    >

    <input
        id="new_exp"
        placeholder="소비기한"
    >

    <input
        id="new_box"
        placeholder="박스수"
        inputmode="numeric"
    >

    <input
        id="new_each"
        placeholder="낱개수량"
        inputmode="numeric"
    >

    <button
        onclick="addNewItem()"
    >
        등록
    </button>

    <button
        onclick="toggleNewItem()"
        style="background:#999;"
    >
        취소
    </button>

</div>


<script>

/* =================================================
   서버에서 전달받은 데이터
================================================= */

let data = {{ data|tojson }};

let mapping = {{ mapping|tojson }};


/* =================================================
   현재 위치
================================================= */

let currentIndex = 0;


/* =================================================
   상품 리스트
================================================= */

let productList = [];


/* =================================================
   이어하기
================================================= */

window.onload = function(){

    let saved =
        localStorage.getItem(
            "inventoryData"
        );

    let savedMapping =
        localStorage.getItem(
            "mappingData"
        );


    if(savedMapping){

        try {

            mapping =
                JSON.parse(
                    savedMapping
                );

        } catch(e) {

            console.error(e);

        }

    }


    if(saved){

        try {

            let savedData =
                JSON.parse(saved);


            if(
                Array.isArray(savedData)
                &&
                savedData.length > 0
            ){

                if(
                    confirm(
                        "이전에 작업한 데이터가 있습니다.\n\n이어하시겠습니까?"
                    )
                ){

                    data =
                        savedData;

                    let savedIndex =
                        localStorage.getItem(
                            "currentIndex"
                        );

                    if(savedIndex){

                        currentIndex =
                            Number(
                                savedIndex
                            );

                    }

                } else {

                    localStorage.removeItem(
                        "inventoryData"
                    );

                    localStorage.removeItem(
                        "currentIndex"
                    );

                }

            }

        } catch(e){

            console.error(e);

            localStorage.removeItem(
                "inventoryData"
            );

        }

    }


    if(
        Array.isArray(mapping)
        &&
        mapping.length > 0
    ){

        localStorage.setItem(
            "mappingData",
            JSON.stringify(mapping)
        );

    }


    if(data.length > 0){

        document
            .getElementById(
                "uploadForm"
            )
            .style.display = "none";


        document
            .getElementById(
                "newItemBtn"
            )
            .style.display = "block";


        render();

    }

};

</script>


<script src="/static/script.js"></script>


</body>

</html>
